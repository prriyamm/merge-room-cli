<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Merge Room conversational cockpit at startup</title>
  <desc id="desc">A liquid-glass terminal showing the one-time woven Merge Room mark before the first prompt.</desc>
  <defs>
    <linearGradient id="mark" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#60a5fa" stop-opacity=".19"/><stop offset="1" stop-color="#0b1220" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020617" flood-opacity=".58"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#080d17"/>
  <ellipse cx="600" cy="390" rx="470" ry="330" fill="url(#glow)"/>
  <rect x="92" y="52" width="1016" height="656" rx="20" fill="#0b1220" stroke="#263449" filter="url(#shadow)"/>
  <rect x="92" y="52" width="1016" height="54" rx="20" fill="#111c2e"/><rect x="92" y="84" width="1016" height="22" fill="#111c2e"/>
  <circle cx="124" cy="79" r="7" fill="#fb7185"/><circle cx="148" cy="79" r="7" fill="#fbbf24"/><circle cx="172" cy="79" r="7" fill="#5eead4"/>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">merge-room — conversational cockpit</text>
  <rect x="92" y="104" width="1016" height="2" fill="url(#bar)"/>
  <g font-family="Cascadia Mono,Consolas,monospace" text-anchor="middle" fill="url(#mark)" font-size="22" xml:space="preserve">
    <text x="600" y="164">╲╲                 ╱╱</text><text x="600" y="194"> ╲╲               ╱╱ </text>
    <text x="600" y="224">  ╲╲     ◇       ╱╱  </text><text x="600" y="254">   ╲╲   ╱ ╲     ╱╱   </text>
    <text x="600" y="284">    ╲╲ ╱   ╲   ╱╱    </text><text x="600" y="314">     ╲╱     ╲ ╱      </text>
    <text x="600" y="344">      ╲     ╱        </text><text x="600" y="374">       ╲   ╱         </text>
    <text x="600" y="404">        ╲ ╱          </text><text x="600" y="434">         ◆           </text>
  </g>
  <g font-family="Cascadia Mono,Consolas,monospace">
    <text x="356" y="492" fill="#f8fafc" font-size="20" font-weight="700">Merge Room</text>
    <text x="492" y="492" fill="#94a3b8" font-size="17">Two rooms. One continuous conversation.</text>
    <text x="356" y="528" fill="#64748b" font-size="15">demo · merge-room-demo · C:\work\merge-room-cli</text>
    <text x="356" y="564" fill="#94a3b8" font-size="15">Type a mission, or use</text><text x="568" y="564" fill="#67e8f9" font-size="15">/help</text><text x="625" y="564" fill="#94a3b8" font-size="15">for cockpit commands.</text>
    <text x="356" y="626" fill="#67e8f9" font-size="17">room 1 ›</text><rect x="455" y="609" width="10" height="22" rx="2" fill="#a78bfa" opacity=".9"/>
  </g>
</svg>
