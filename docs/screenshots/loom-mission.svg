<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Loom CLI running a multi-agent mission</title>
  <desc id="desc">A dark terminal window showing Scout, Architect, Maker, and Critic completing a mission with token usage in the footer.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6ee7d4"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06070d" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#0a0c13"/>
  <rect x="84" y="64" width="1032" height="632" rx="18" fill="#111520" stroke="#2a3142" filter="url(#shadow)"/>
  <rect x="84" y="64" width="1032" height="54" rx="18" fill="#171c2b"/><rect x="84" y="100" width="1032" height="18" fill="#171c2b"/><rect x="84" y="116" width="1032" height="3" fill="url(#bar)"/>
  <circle cx="116" cy="91" r="7" fill="#ff6f91"/><circle cx="140" cy="91" r="7" fill="#f6c85f"/><circle cx="164" cy="91" r="7" fill="#6ee7d4"/>
  <text x="600" y="96" text-anchor="middle" fill="#aeb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="14">loom — mission cockpit</text>
  <g font-family="Cascadia Mono,Consolas,monospace" font-size="18">
    <text x="126" y="164" fill="#6ee7d4">Loom</text><text x="194" y="164" fill="#dbe2f1">· Map the first three steps for a new feature</text>
    <line x1="126" y1="188" x2="1034" y2="188" stroke="#2a3142"/>
    <text x="126" y="232" fill="#6ee7d4">✓</text><text x="162" y="232" fill="#dbe2f1">Scout</text><text x="330" y="232" fill="#7f8aa3">done</text><text x="770" y="232" fill="#66718a">orienting the problem space</text>
    <text x="126" y="272" fill="#6ee7d4">✓</text><text x="162" y="272" fill="#dbe2f1">Architect</text><text x="330" y="272" fill="#7f8aa3">done</text><text x="770" y="272" fill="#66718a">shaping a practical plan</text>
    <text x="126" y="312" fill="#6ee7d4">✓</text><text x="162" y="312" fill="#dbe2f1">Maker</text><text x="330" y="312" fill="#7f8aa3">done</text><text x="770" y="312" fill="#66718a">turning notes into a next move</text>
    <text x="126" y="352" fill="#6ee7d4">✓</text><text x="162" y="352" fill="#dbe2f1">Critic</text><text x="330" y="352" fill="#7f8aa3">done</text><text x="770" y="352" fill="#66718a">checking the plan</text>
    <line x1="126" y1="388" x2="1034" y2="388" stroke="#2a3142"/>
    <text x="126" y="432" fill="#eef2ff">A practical starting point:</text>
    <text x="150" y="474" fill="#dbe2f1">1.</text><text x="190" y="474" fill="#c7d0e5">Define the outcome and the constraint.</text>
    <text x="150" y="510" fill="#dbe2f1">2.</text><text x="190" y="510" fill="#c7d0e5">Make the smallest reversible change.</text>
    <text x="150" y="546" fill="#dbe2f1">3.</text><text x="190" y="546" fill="#c7d0e5">Verify it with one concrete check.</text>
    <text x="126" y="592" fill="#6ee7d4">Next move:</text><text x="260" y="592" fill="#dbe2f1">write the first acceptance check and assign an owner.</text>
    <line x1="126" y1="620" x2="1034" y2="620" stroke="#2a3142"/>
    <text x="126" y="660" fill="#6ee7d4">✓ Mission complete in 1.7s</text><text x="570" y="660" fill="#9b8cff">usage ~1.5k burned · ~1.2k in · ~309 out · 5 calls · 4 agents</text>
  </g>
</svg>
