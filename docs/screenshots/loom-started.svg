<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Loom CLI started in a terminal</title>
  <desc id="desc">A dark terminal window showing the Loom help screen and its commands.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6ee7d4"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06070d" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="760" fill="#0a0c13"/>
  <rect x="84" y="64" width="1032" height="632" rx="18" fill="#111520" stroke="#2a3142" filter="url(#shadow)"/>
  <rect x="84" y="64" width="1032" height="54" rx="18" fill="#171c2b"/><rect x="84" y="100" width="1032" height="18" fill="#171c2b"/>
  <circle cx="116" cy="91" r="7" fill="#ff6f91"/><circle cx="140" cy="91" r="7" fill="#f6c85f"/><circle cx="164" cy="91" r="7" fill="#6ee7d4"/>
  <text x="600" y="96" text-anchor="middle" fill="#aeb7c9" font-family="Inter,Segoe UI,sans-serif" font-size="14">loom — terminal workspace</text>
  <rect x="84" y="116" width="1032" height="3" fill="url(#bar)"/>
  <g font-family="Cascadia Mono,Consolas,monospace" font-size="18">
    <text x="126" y="164" fill="#6ee7d4">LOOM</text><text x="194" y="164" fill="#dbe2f1">· multi-agent command cockpit</text>
    <text x="126" y="204" fill="#7f8aa3">  loom "your mission"       </text><text x="530" y="204" fill="#dbe2f1">run a mission</text>
    <text x="126" y="232" fill="#7f8aa3">  loom run "your mission"   </text><text x="530" y="232" fill="#dbe2f1">explicit run form</text>
    <text x="126" y="260" fill="#7f8aa3">  loom interactive           </text><text x="530" y="260" fill="#dbe2f1">open the cockpit</text>
    <text x="126" y="288" fill="#7f8aa3">  loom --json "mission"     </text><text x="530" y="288" fill="#dbe2f1">return JSON for scripts</text>
    <text x="126" y="330" fill="#7f8aa3">  loom agents                </text><text x="530" y="330" fill="#dbe2f1">show the specialist roster</text>
    <text x="126" y="358" fill="#7f8aa3">  loom history               </text><text x="530" y="358" fill="#dbe2f1">list saved missions</text>
    <text x="126" y="386" fill="#7f8aa3">  loom usage                 </text><text x="530" y="386" fill="#dbe2f1">aggregate saved token usage</text>
    <text x="126" y="414" fill="#7f8aa3">  loom show &lt;id&gt;            </text><text x="530" y="414" fill="#dbe2f1">reopen a saved mission</text>
    <text x="126" y="456" fill="#7f8aa3">  loom context               </text><text x="530" y="456" fill="#dbe2f1">preview workspace context</text>
    <text x="126" y="484" fill="#7f8aa3">  loom doctor                </text><text x="530" y="484" fill="#dbe2f1">check local setup</text>
    <text x="126" y="526" fill="#7f8aa3">  loom --no-context          </text><text x="530" y="526" fill="#dbe2f1">skip workspace excerpts</text>
    <text x="126" y="568" fill="#7f8aa3">  loom --help                </text><text x="530" y="568" fill="#dbe2f1">show this guide</text>
    <text x="126" y="626" fill="#6ee7d4">›</text><text x="151" y="626" fill="#eef2ff">Ready when you are.</text><rect x="366" y="610" width="10" height="22" fill="#9b8cff" opacity=".9"/>
  </g>
</svg>
